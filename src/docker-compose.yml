version: '3.8'

services:
  nop-web:
    build:
      context: .
      dockerfile: Presentation/Nop.Web/Dockerfile
    container_name: nop-web
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__SqlConnection=Server=sqlserver;Database=nopCommerce;User ID=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True
    depends_on:
      - sqlserver
    restart: unless-stopped
    volumes:
      - nop-data:/app/App_Data

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nop-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  nop-data:
  sqlserver-data: